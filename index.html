<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DÁM ƯỚC MƠ – DÁM BƯỚC RA | Interactive 3D Presentation</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-night: #070B19;
      --bg-indigo: #161B36;
      --bg-purple: #2A1B4E;
      --accent-orange: #FF6B35;
      --accent-gold: #FFB800;
      --accent-cyan: #38BDF8;
      --text-main: #F8FAFC;
      --text-muted: #CBD5E1;
      --glass-bg: rgba(22, 27, 54, 0.62);
      --glass-border: rgba(255, 184, 0, 0.25);
      --card-radius: 20px;
      --transition-slow: 0.85s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Be Vietnam Pro', sans-serif;
      background-color: var(--bg-night);
      color: var(--text-main);
      user-select: none;
    }

    /* Nền chuyển màu động theo tiến trình slide */
    #ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: radial-gradient(circle at 50% 110%, rgba(255, 107, 53, 0.22), rgba(42, 27, 78, 0.65) 45%, #070B19 85%);
      transition: background 1.2s ease;
    }

    /* Canvas hạt ánh sáng 3D */
    #particle-canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    /* Vầng sáng chân trời */
    .horizon-glow {
      position: fixed;
      bottom: -18vh;
      left: 50%;
      transform: translateX(-50%);
      width: 130vw;
      height: 45vh;
      background: radial-gradient(ellipse at center, rgba(255, 184, 0, 0.32) 0%, rgba(255, 107, 53, 0.14) 40%, transparent 75%);
      filter: blur(45px);
      z-index: 1;
      pointer-events: none;
      transition: all 1s ease;
    }

    /* Thanh tiến trình trên cùng */
    .progress-bar-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 100;
    }

    .progress-bar {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, var(--accent-orange), var(--accent-gold));
      box-shadow: 0 0 15px var(--accent-gold);
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Header cố định */
    .top-nav {
      position: fixed;
      top: 18px;
      left: 36px;
      right: 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 90;
      pointer-events: none;
    }

    .brand-badge {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 184, 0, 0.3);
      backdrop-filter: blur(12px);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent-gold);
    }

    .slide-counter {
      pointer-events: auto;
      font-family: 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 1rem;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: var(--text-main);
    }

    /* Khung chứa toàn bộ Slides */
    .deck-viewport {
      position: relative;
      width: 100vw;
      height: 100vh;
      perspective: 1400px;
      z-index: 10;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 80px 7vw 90px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(80px, 0, -180px) rotateY(-8deg) scale(0.94);
      transition: transform var(--transition-slow), opacity var(--transition-slow);
    }

    .slide.active {
      opacity: 1;
      pointer-events: auto;
      transform: translate3d(0, 0, 0) rotateY(0deg) scale(1);
      z-index: 20;
    }

    .slide.prev {
      opacity: 0;
      transform: translate3d(-80px, 0, -180px) rotateY(8deg) scale(0.94);
    }

    /* Hiệu ứng xuất hiện tuần tự cho phần tử bên trong slide */
    .stagger-item {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.65s ease, transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .slide.active .stagger-item {
      opacity: 1;
      transform: translateY(0);
    }

    .slide.active .stagger-item:nth-child(1) { transition-delay: 0.12s; }
    .slide.active .stagger-item:nth-child(2) { transition-delay: 0.24s; }
    .slide.active .stagger-item:nth-child(3) { transition-delay: 0.36s; }
    .slide.active .stagger-item:nth-child(4) { transition-delay: 0.48s; }
    .slide.active .stagger-item:nth-child(5) { transition-delay: 0.60s; }

    /* Typography */
    .slide-tag {
      display: inline-block;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--accent-gold);
      margin-bottom: 10px;
    }

    .slide-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2rem, 3.8vw, 3.4rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #FFFFFF 20%, #FFD166 65%, #FF6B35 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: clamp(2.8rem, 5.5vw, 5.2rem);
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1.08;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #FFFFFF 0%, #FFE082 55%, #FF6B35 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 12px 28px rgba(255, 107, 53, 0.35));
    }

    .slide-subtitle {
      font-size: clamp(1rem, 1.4vw, 1.25rem);
      color: var(--text-muted);
      max-width: 820px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* Bố cục Grid & Cards */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      width: 100%;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      width: 100%;
    }

    .grid-5 {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
      width: 100%;
    }

    .glass-card {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--card-radius);
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      transform-style: preserve-3d;
      position: relative;
      overflow: hidden;
    }

    .glass-card:hover {
      border-color: var(--accent-gold);
      box-shadow: 0 25px 50px rgba(255, 107, 53, 0.22), inset 0 1px 2px rgba(255, 255, 255, 0.3);
    }

    .card-number {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: rgba(255, 184, 0, 0.28);
      margin-bottom: 8px;
      line-height: 1;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #FFF;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-text {
      font-size: 0.96rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .highlight-box {
      margin-top: 22px;
      padding: 18px 26px;
      border-left: 4px solid var(--accent-gold);
      background: linear-gradient(90deg, rgba(255, 184, 0, 0.16), rgba(22, 27, 54, 0.4));
      border-radius: 0 16px 16px 0;
      font-size: 1.08rem;
      font-weight: 500;
      color: #FFF;
    }

    /* Hộp câu hỏi mở đầu & kết thúc */
    .question-banner {
      display: inline-block;
      margin-top: 16px;
      padding: 20px 34px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255, 107, 53, 0.25), rgba(255, 184, 0, 0.15));
      border: 1px solid rgba(255, 184, 0, 0.5);
      box-shadow: 0 15px 35px rgba(255, 107, 53, 0.25);
      font-size: clamp(1.15rem, 1.8vw, 1.6rem);
      font-weight: 700;
      color: #FFF;
    }

    /* Badge nhỏ */
    .pill {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: rgba(255, 107, 53, 0.25);
      color: #FFD166;
      border: 1px solid rgba(255, 184, 0, 0.4);
      margin-bottom: 10px;
    }

    /* So sánh Vùng an toàn vs Thế giới bên ngoài */
    .zone-safe {
      border-color: rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.7);
    }

    .zone-growth {
      border-color: rgba(255, 184, 0, 0.55);
      background: linear-gradient(145deg, rgba(255, 107, 53, 0.22), rgba(42, 27, 78, 0.7));
    }

    .bullet-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .bullet-list li {
      position: relative;
      padding-left: 24px;
      font-size: 0.96rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .bullet-list li::before {
      content: "✦";
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-gold);
      font-weight: bold;
    }

    /* Thanh điều khiển dưới cùng */
    .bottom-controls {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(10, 15, 32, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      z-index: 100;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding
